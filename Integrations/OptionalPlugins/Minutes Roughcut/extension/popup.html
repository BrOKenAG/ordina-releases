<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minutes Roughcut</title><link rel="stylesheet" href="style.css"></head>
<body><header class="header"><img class="brand-icon" src="icons/logo.png" alt=""><div><h1>Minutes Roughcut</h1><p class="project" id="title">当前妙记</p></div><button id="read" class="quiet">重新读取</button></header>
<div class="status" id="status" role="status" aria-live="polite">读取当前页面…</div>
<section class="summary" aria-label="划稿统计"><div><span>保留区间</span><strong><b id="count">—</b><em>段</em></strong></div><div><span>保留时长</span><strong id="total">—</strong></div></section>
<div class="bottom"><button id="send" class="primary" disabled>发送到达芬奇</button><button id="export" class="secondary export" disabled>导出 JSON</button></div>
<details><summary>手动导入响应</summary><label class="sr-only" for="manual">timeline_v2 响应 JSON</label><textarea id="manual" placeholder="粘贴 timeline_v2 响应 JSON"></textarea><button id="import" class="secondary">解析 JSON</button></details>
<script src="core.js"></script><script src="popup.js"></script></body></html>
